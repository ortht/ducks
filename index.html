<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f6b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Find the Ducks</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#2f6b45;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{position:fixed;inset:0;width:100%}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;text-align:center;pointer-events:none}
h1{margin:0;font-size:clamp(28px,8.5vw,42px);font-weight:900;color:#fff;letter-spacing:.5px;line-height:1.1;
  -webkit-text-stroke:7px #14301f;paint-order:stroke fill;text-shadow:0 4px 0 #14301f,0 0 14px rgba(0,0,0,.45)}
.row{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px}
.pill{background:rgba(20,50,35,.7);color:#fff;font-weight:700;font-size:18px;line-height:1;font-family:inherit;border:2px solid rgba(255,255,255,.35);
  padding:7px 14px;border-radius:99px;font-variant-numeric:tabular-nums;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
button.pill{pointer-events:auto;cursor:pointer}
button.ico{padding:7px 10px;min-width:44px;min-height:34px}
button.ico.off{opacity:.55}
button.pill:active,.big:active{transform:scale(.95)}
.bad{background:#b3261e;transition:background .1s}
#hint{position:absolute;left:50%;white-space:nowrap;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px)}
.overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;text-align:center;color:#fff;background:rgba(15,40,30,.75);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.overlay.hide{display:none}
.overlay h2{margin:0;font-size:40px;font-weight:900;text-shadow:0 3px 0 #14301f}
.overlay p{margin:0;font-size:19px;max-width:300px;line-height:1.4}
.overlay p.small{font-size:16px;opacity:.85}
.big{font-weight:800;font-size:26px;line-height:1;font-family:inherit;color:#3a2200;background:#ffc93c;border:3px solid #14301f;border-radius:16px;
  padding:14px 38px;box-shadow:0 5px 0 #14301f;cursor:pointer;margin-top:6px}
.big.sec{font-size:19px;background:#fff;padding:10px 26px;box-shadow:0 4px 0 #14301f;margin-top:0}
.link{background:none;border:0;color:#fff;opacity:.8;text-decoration:underline;font:inherit;font-size:15px;cursor:pointer;padding:10px}
.hit{fill:transparent;cursor:pointer}
#fx{pointer-events:none}
.found .pop{animation:pop .6s cubic-bezier(.3,1.4,.5,1)}
.pop,.mark,.hintring,.rip{transform-box:fill-box;transform-origin:center}
.mark{animation:in .35s ease-out}
.hintring{fill:none;stroke:#ffd23f;stroke-width:4;animation:pulse .8s ease-out 3}
.rip{fill:none;stroke:#fff;stroke-width:2;animation:rip .45s ease-out forwards}
/* Ruhe-Animation: innere Gruppe (.ia), damit Position/Skalierung/Flip unberührt bleiben */
.ia{transform-box:fill-box;transform-origin:center bottom;animation:waddle var(--wd,3s) ease-in-out var(--wl,0s) infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink var(--bl,5s) linear var(--bd,0s) infinite}
.found .ia,.found .eye{animation:none}
@keyframes waddle{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-1.2px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:translateY(-12px) scale(1.6) rotate(-8deg)}65%{transform:translateY(0) scale(1.7) rotate(-4deg)}100%{transform:scale(1.15)}}
@keyframes in{from{transform:scale(0);opacity:0}}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes rip{from{transform:scale(.3);opacity:.8}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.ia,.eye{animation:none!important}}
</style>
</head>

<g id="back"></g>
<g id="ducks"></g>
<g id="front"></g>
<g id="hits"></g>
<g id="fx"></g>
</svg>

<div id="hud">
  <h1 id="lv">Level 1</h1>
  <div class="row">
    <span class="pill" id="cnt">0 / 10</span>
    <span class="pill" id="tm">0:00</span>
    <button class="pill ico" id="mus" aria-label="Musik an/aus">🎵</button>
    <button class="pill ico" id="sfx" aria-label="Soundeffekte an/aus">🔊</button>
  </div>
</div>
<button class="pill" id="hint">💡 Hinweis (+10 s)</button>

<div class="overlay" id="start">
  <h2>Find the Ducks</h2>
  <p>Zehn Enten haben sich versteckt. Finde sie alle, so schnell du kannst!</p>
  <p class="small" id="cont"></p>
  <button class="big" id="go">Start</button>
  <button class="link" id="reset">Von vorn</button>
</div>
<div class="overlay hide" id="win">
  <h2>Geschafft!</h2>
  <p id="res"></p>
  <p class="small" id="bt"></p>
  <button class="big" id="next">Nächstes Level</button>
  <button class="big sec" id="again">Nochmal</button>
</div>
<div class="overlay hide" id="done">
  <h2>Alle 10 Level geschafft!</h2>
  <p id="dres"></p>
  <button class="big" id="restart">Von vorn</button>
  <button class="big sec" id="again2">Level 10 nochmal</button>
</div>

  if (!best || typeof best !== 'object') best = {};
  const rnd = (a, b) => a + Math.random() * (b - a);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const ms = () => (running ? performance.now() : endT) - t0 + pen;
  const fmt = v => { const s = Math.floor(v / 1000); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
  const tick = () => { $('#tm').textContent = fmt(ms()); };
  const NS = 'http://www.w3.org/2000/svg';
  const show = id => { ['#start', '#win', '#done'].forEach(s => $(s).classList.toggle('hide', s !== id)); };

  function newRound() {
    const sc = sceneFor(level), c = cfg(level);
    loadScene(sc);
    const all = shuffle(sc.slots.slice()), out = [];
    const add = (f, n, d) => {
      for (const s of all)
        if (n > 0 && out.length < N && f(s) && !out.includes(s) && out.every(o => Math.hypot(o[1] - s[1], o[2] - s[2]) >= d)) { out.push(s); n--; }
    };
    add(s => s[0] === 'h', c.nH, 58);
    add(s => s[0] === 't', c.nT, 58);
    add(s => s[0] === 'o', N, 58);
    add(() => true, N, 58);
    add(() => true, N, 40);
    add(() => true, N, 0);                       // Sicherheitsnetz: immer genau N Enten
    const soft = out.map((s, i) => i).filter(i => out[i][0] !== 'h');   // Mini-Ente nie hinter Vordergrund
    const tiny = soft[Math.random() * soft.length | 0];
    ducks = out.map(([k, x, y], i) => {
      const tn = i === tiny;
      const s = tn ? (c.hard ? 0.27 : 0.5 + 0.1 * (1 - c.k))
        : k === 'h' ? (c.hard ? rnd(0.5, 0.58) : rnd(Math.max(0.6, c.smin), Math.min(0.95, Math.max(0.7, c.smax))))
        : k === 't' ? (c.hard ? rnd(0.36, 0.48) : rnd(Math.max(0.55, c.smin - 0.1), Math.min(0.9, c.smax)))
        : rnd(c.smin, c.smax);
      const op = k === 't' ? rnd(0.5 - 0.1 * c.k, 0.7 - 0.1 * c.k) : k === 'o' && !tn && Math.random() < c.pSoft ? rnd(c.opLo, c.opHi) : 1;
      const tint = !tn && Math.random() < c.pTint ? sc.tint.find(b => y <= b[0])[1] : null;
      return { x: x + rnd(-5, 5), y: y + rnd(-5, 5), s, op, tint, flip: Math.random() < 0.5 ? -1 : 1, found: false };
    });
    Ld.innerHTML = Lh.innerHTML = Lf.innerHTML = '';
    ducks.forEach((d, i) => {
      // Tönung direkt in die Farben gerechnet (statt SVG-Filter auf animierter Gruppe = Neuberechnung pro Frame)
      const art = d.tint ? tintDuck(c.tintA, d.tint) : DUCK;
      // Idle-Animation in innerer Gruppe .ia; Phasen/Dauern pro Ente zufällig
      const sty = `--wd:${rnd(2.4, 3.8).toFixed(2)}s;--wl:-${rnd(0, 3).toFixed(2)}s;--bl:${rnd(4, 7).toFixed(2)}s;--bd:-${rnd(0, 6).toFixed(2)}s`;
      Ld.insertAdjacentHTML('beforeend',
        `<g id="d${i}" transform="translate(${d.x} ${d.y})"><g class="pop"><g class="body" opacity="${d.op}" transform="scale(${d.flip * d.s} ${d.s})">` +
        `<g class="ia" style="${sty}"><g class="art" transform="translate(-20 -20)">${art}</g></g></g></g></g>`);
      Lh.insertAdjacentHTML('beforeend',
        `<circle class="hit" data-i="${i}" cx="${d.x}" cy="${d.y}" r="${Math.max(25, 22 * d.s + 8)}"/>`);
    });
    found = 0; pen = 0; hintOn = false; running = true; t0 = performance.now();
    $('#lv').textContent = 'Level ' + level;
    $('#cnt').textContent = `0 / ${N}`;
    show(null);
    tick(); syncMusic();
  }

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return parent.appendChild(e);
  }

  function findDuck(i) {
    const d = ducks[i];
    if (!running || d.found) return;
    d.found = true; found++;
    quack();
    const g = $('#d' + i), body = g.querySelector('.body');
    body.setAttribute('opacity', 1);   // gefundene Ente: volle Farbe
    if (d.tint) body.querySelector('.art').innerHTML = DUCK;
    Lf.appendChild(g);                 // Ente kommt vor den Vordergrund
    g.classList.add('found');
    const r = 20 * d.s + 8;
    el('circle', { class: 'mark', r, fill: 'none', stroke: '#3be37a', 'stroke-width': 3.5 }, g);
    const b = el('g', { class: 'mark', transform: `translate(${r * 0.75} ${-r * 0.75})` }, g);
    el('circle', { r: 8, fill: '#3be37a', stroke: '#14301f', 'stroke-width': 1.5 }, b);
    el('path', { d: 'M-4 0L-1 3.5L4.5 -3', fill: 'none', stroke: '#fff', 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, b);
    Lh.querySelector(`[data-i="${i}"]`).remove();
    $('#cnt').textContent = `${found} / ${N}`;
    if (found === N) win();
  }

  function win() {
    running = false; endT = performance.now(); tick(); syncMusic();
    const t = Math.round(ms()), prev = best[level], isBest = !prev || t < prev;
    if (isBest) { best[level] = t; store.set('best', best); }
    if (level < MAXL && level + 1 > maxLevel) { maxLevel = level + 1; store.set('level', maxLevel); }
    setTimeout(() => {
      if (level === MAXL) {
        $('#dres').textContent = `Level ${MAXL} in ${fmt(t)}` + (isBest ? ' – neue Bestzeit!' : '');
        show('#done');
      } else {
        $('#res').textContent = `Level ${level}: alle ${N} Enten gefunden in ${fmt(t)}`;
        $('#bt').textContent = isBest ? 'Neue Bestzeit!' : `Bestzeit: ${fmt(best[level])}`;
        show('#win');
      }
      jingle();
    }, 800);
  }

  function hint() {
    if (!running || hintOn) return;
    const open = ducks.map((d, i) => i).filter(i => !ducks[i].found);
    if (!open.length) return;
    const d = ducks[open[Math.random() * open.length | 0]];
    hintOn = true; pen += 10000; tick();
    $('#tm').classList.add('bad'); setTimeout(() => $('#tm').classList.remove('bad'), 900);
    const c = el('circle', { class: 'hintring', cx: d.x, cy: d.y, r: Math.max(34, 26 * d.s + 10) }, Lf);
    c.addEventListener('animationend', () => { c.remove(); hintOn = false; });
  }

  function refreshStart() {
    $('#cont').textContent = maxLevel > 1 ? `Weiter bei Level ${maxLevel}` : '';
    $('#reset').style.display = maxLevel > 1 ? '' : 'none';
    $('#lv').textContent = 'Level ' + maxLevel;
    loadScene(sceneFor(maxLevel));
  }
  function fromScratch() { maxLevel = level = 1; store.set('level', 1); newRound(); }
  function refreshToggles() {
    $('#sfx').textContent = sfxOn ? '🔊' : '🔇'; $('#sfx').classList.toggle('off', !sfxOn);
    $('#mus').classList.toggle('off', !musicOn);
    $('#sfx').setAttribute('aria-pressed', sfxOn); $('#mus').setAttribute('aria-pressed', musicOn);
  }

  // ---------- Eingaben ----------
  Lh.addEventListener('pointerdown', e => {
    const c = e.target.closest('.hit');
    if (c) { e.stopPropagation(); e.preventDefault(); findDuck(+c.dataset.i); }
  });
  svg.addEventListener('pointerdown', e => {      // Fehlklick: kleiner neutraler Ring
    if (!running) return;
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    const c = el('circle', { class: 'rip', cx: q.x, cy: q.y, r: 12 }, Lf);
    c.addEventListener('animationend', () => c.remove());
  });
  $('#go').addEventListener('click', () => { audio(); level = maxLevel; newRound(); });
  $('#reset').addEventListener('click', () => {
    if (maxLevel > 1) { let ok = true; try { ok = confirm('Fortschritt zurücksetzen und bei Level 1 beginnen?'); } catch (e) {} if (!ok) return; }
    audio(); fromScratch();
  });
  $('#next').addEventListener('click', () => { audio(); level = Math.min(MAXL, level + 1); newRound(); });
  $('#again').addEventListener('click', () => { audio(); newRound(); });
  $('#again2').addEventListener('click', () => { audio(); newRound(); });
  $('#restart').addEventListener('click', () => { audio(); fromScratch(); });
  $('#hint').addEventListener('click', hint);
  $('#sfx').addEventListener('click', () => { sfxOn = !sfxOn; store.set('sfx', sfxOn); refreshToggles(); });
  $('#mus').addEventListener('click', () => { musicOn = !musicOn; store.set('music', musicOn); refreshToggles(); audio(); syncMusic(); });
  setInterval(() => { if (running) tick(); }, 250);
  // Timer und Musik pausieren, solange der Tab verborgen ist
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = performance.now();
    else if (hiddenAt) { if (running) t0 += performance.now() - hiddenAt; hiddenAt = 0; tick(); }
    syncMusic();
  });

  // Zoom / Bounce verhindern
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());

  refreshToggles(); refreshStart();
})();
</script>
</body>
</html>
