<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f6b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Find the Ducks</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#2f6b45;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{position:fixed;inset:0;width:100%}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;text-align:center;pointer-events:none}
h1{margin:0;font-size:clamp(28px,8.5vw,42px);font-weight:900;color:#fff;letter-spacing:.5px;line-height:1.1;
  -webkit-text-stroke:7px #14301f;paint-order:stroke fill;text-shadow:0 4px 0 #14301f,0 0 14px rgba(0,0,0,.45)}
.row{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px}
.pill{background:rgba(20,50,35,.7);color:#fff;font-weight:700;font-size:18px;line-height:1;font-family:inherit;border:2px solid rgba(255,255,255,.35);
  padding:7px 14px;border-radius:99px;font-variant-numeric:tabular-nums;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
button.pill{pointer-events:auto;cursor:pointer}
button.pill:active,.big:active{transform:scale(.95)}
.bad{background:#b3261e;transition:background .1s}
#hint{position:absolute;left:50%;white-space:nowrap;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px)}
.overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;text-align:center;color:#fff;background:rgba(15,40,30,.75);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.overlay.hide{display:none}
.overlay h2{margin:0;font-size:40px;font-weight:900;text-shadow:0 3px 0 #14301f}
.overlay p{margin:0;font-size:19px;max-width:300px;line-height:1.4}
.big{font-weight:800;font-size:26px;line-height:1;font-family:inherit;color:#3a2200;background:#ffc93c;border:3px solid #14301f;border-radius:16px;
  padding:14px 38px;box-shadow:0 5px 0 #14301f;cursor:pointer;margin-top:6px}
.hit{fill:transparent;cursor:pointer}
#fx{pointer-events:none}
.found .pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
.pop,.mark,.hintring,.rip{transform-box:fill-box;transform-origin:center}
.mark{animation:in .35s ease-out}
.hintring{fill:none;stroke:#ffd23f;stroke-width:4;animation:pulse .8s ease-out 3}
.rip{fill:none;stroke:#fff;stroke-width:2;animation:rip .45s ease-out forwards}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.7) rotate(-8deg)}100%{transform:scale(1.15)}}
@keyframes in{from{transform:scale(0);opacity:0}}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes rip{from{transform:scale(.3);opacity:.8}to{transform:scale(1.5);opacity:0}}
</style>
</head>
<body>

<svg id="game" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b5dcd6"/><stop offset="1" stop-color="#eef7ea"/></linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86cfd2"/><stop offset="1" stop-color="#2f8fa6"/></linearGradient>
  <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/></linearGradient>
  <pattern id="planks" width="16" height="30" patternUnits="userSpaceOnUse">
    <rect width="16" height="30" fill="#bf8b52"/><rect width="2.5" height="30" fill="#5e3a1c"/><rect x="7" y="6" width="1.5" height="9" fill="#92602f"/>
  </pattern>

  <symbol id="duck" viewBox="0 0 40 40" overflow="visible">
    <g stroke="#111" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M17 33l-1 4M16 37l-3 0M16 37l3 0M25 33l-1 4M24 37l-3 0M24 37l3 0" fill="none" stroke="#f08a00" stroke-width="2.4"/>
      <path d="M17 33l-1 4M25 33l-1 4" fill="none" stroke="#111" stroke-width="0"/>
      <path d="M8 24C8 17 14 15 20 17C27 15 34 15 37 12C36 20 35 33 22 35C13 36 8 31 8 24Z" fill="#fff"/>
      <path d="M17 24C21 22 27 24 29 28C25 31 18 30 17 24Z" fill="#e9eef2"/>
      <circle cx="12" cy="13" r="7.5" fill="#fff"/>
      <path d="M5.5 11C1 11 0 15 2 16.5C4 18 7 17 8 15Z" fill="#ffa81c"/>
    </g>
    <circle cx="10.5" cy="11.5" r="1.4" fill="#111"/>
  </symbol>

  <g id="bush" stroke="#1d5233" stroke-width="2.5">
    <circle cx="-24" cy="4" r="20" fill="#3f9150"/><circle cx="24" cy="4" r="20" fill="#3f9150"/>
    <circle cx="0" cy="-8" r="26" fill="#47a057"/><circle cx="0" cy="8" r="22" fill="#3f9150"/>
    <circle cx="-8" cy="-16" r="8" fill="#6cc078" stroke="none"/><circle cx="16" cy="-4" r="6" fill="#6cc078" stroke="none"/>
  </g>
  <g id="rock">
    <path d="M-26 10Q-28 -8-10 -16Q8 -22 22 -8Q32 4 26 10Z" fill="#8f949c" stroke="#2f3338" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-14 -8Q-2 -14 8 -10" stroke="#c9cdd3" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g id="pad"><ellipse rx="15" ry="6" fill="#58b052" stroke="#2a6b30" stroke-width="1.5"/><path d="M0 0L15 -3" stroke="#2a6b30" fill="none"/></g>
  <g id="lotus"><circle r="4.5" fill="#ff9fc4" stroke="#b24a78" stroke-width="1.5"/><circle r="1.5" fill="#ffe066"/></g>
  <g id="reed" stroke="#4d7a2e" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M-10 0Q-12 -30-16 -55M0 0Q0 -35 2 -70M10 0Q13 -28 18 -50"/>
    <path d="M2 -58V-76M-16 -48V-60M18 -44V-56" stroke="#5a3a1e" stroke-width="6"/>
  </g>
  <g id="frond">
    <path d="M0 0C25 -34 75 -34 105 18C72 -8 32 -8 0 0Z" fill="#3fa04f" stroke="#1f5a2e" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M4 -2C40 -14 75 -8 98 14" stroke="#7fd08a" stroke-width="2" fill="none"/>
  </g>
  <g id="half"><use href="#frond" transform="rotate(-82)"/><use href="#frond" transform="rotate(-50)"/><use href="#frond" transform="rotate(-18)"/><use href="#frond" transform="rotate(14) scale(.9)"/></g>
  <g id="crown"><use href="#half"/><use href="#half" transform="scale(-1 1)"/>
    <circle cx="-6" cy="8" r="6" fill="#6b4423" stroke="#2c1a0a" stroke-width="2"/><circle cx="7" cy="9" r="6" fill="#6b4423" stroke="#2c1a0a" stroke-width="2"/></g>
  <g id="trunk"><path d="M-7 0Q6 180-4 360L11 360Q21 180 8 0Z" fill="#9a6a3c" stroke="#4a2c14" stroke-width="2.5"/>
    <path d="M-5 0Q8 180-2 360" fill="none" stroke="#6e4524" stroke-width="12" stroke-dasharray="3 14" opacity=".6"/></g>
</defs>

<g id="back">
  <rect x="-600" y="-600" width="1600" height="900" fill="url(#sky)"/>
  <circle cx="300" cy="70" r="60" fill="#fff" opacity=".45"/>
  <path d="M-600 300V190L20 130L90 190L170 110L260 200L330 140L420 200L1000 170V300Z" fill="#a8cdc0"/>
  <rect x="-600" y="170" width="1600" height="130" fill="url(#mist)"/>
  <path d="M-600 310V230L40 170L120 240L210 160L300 245L380 190L1000 250V310Z" fill="#86b8a3"/>
  <rect x="-600" y="220" width="1600" height="90" fill="url(#mist)" opacity=".8"/>
  <path d="M-600 306V270Q60 230 160 275Q260 240 380 280Q450 260 1000 280V306Z" fill="#4d8f6b"/>
  <use href="#bush" transform="translate(30 300) scale(.35)"/><use href="#bush" transform="translate(170 303) scale(.3)"/>
  <use href="#bush" transform="translate(250 302) scale(.4)"/><use href="#bush" transform="translate(370 301) scale(.3)"/>
  <rect x="-600" y="298" width="1600" height="320" fill="url(#lake)"/>
  <g stroke="#fff" opacity=".4" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M40 325h40M250 322h50M120 372h30M300 410h60M20 395h30M200 335h26M330 372h30M150 495h40M260 540h50M30 560h50"/></g>
  <use href="#pad" x="130" y="400"/><use href="#pad" x="250" y="396"/><use href="#pad" x="182" y="350"/><use href="#pad" x="320" y="350"/>
  <use href="#pad" x="72" y="360"/><use href="#pad" x="352" y="505"/><use href="#pad" x="190" y="522"/><use href="#pad" x="45" y="420"/>
  <use href="#lotus" x="184" y="348"/><use href="#lotus" x="322" y="348"/><use href="#lotus" x="252" y="394"/>
  <use href="#rock" x="300" y="520"/><use href="#rock" x="92" y="502" transform="translate(0 0)"/><use href="#rock" transform="translate(240 345) scale(.5)"/>
  <g fill="#5a3a1e"><rect x="10" y="470" width="8" height="40"/><rect x="90" y="470" width="8" height="40"/><rect x="170" y="470" width="8" height="40"/>
    <rect x="250" y="470" width="8" height="40"/><rect x="330" y="470" width="8" height="40"/></g>
  <rect x="-600" y="470" width="1600" height="14" fill="#2c6f80" opacity=".45"/>
  <g stroke="#5e3a1c" stroke-width="4" stroke-linecap="round"><path d="M-600 424H1000"/><path d="M12 424V442M62 424V442M112 424V442M162 424V442M212 424V442M262 424V442M312 424V442M362 424V442" stroke-width="5"/></g>
  <rect x="-600" y="440" width="1600" height="30" fill="url(#planks)" stroke="#4a2c14" stroke-width="2"/>
  <rect x="-600" y="470" width="1600" height="6" fill="#6e4524"/>
  <path d="M-600 700V575Q80 538 200 558Q330 538 1000 580V1300H-600Z" fill="#e6d6a4"/>
  <path d="M-600 700V592Q80 556 200 576Q330 556 1000 598V1300H-600Z" fill="#78b45c"/>
  <g fill="#5e9a48"><circle cx="40" cy="660" r="4"/><circle cx="130" cy="630" r="3"/><circle cx="260" cy="650" r="4"/><circle cx="360" cy="680" r="3"/><circle cx="210" cy="600" r="3"/></g>
  <use href="#trunk" transform="translate(62 250)"/><use href="#trunk" transform="translate(350 292) scale(1 .95)"/>
</g>

<g id="ducks"></g>

<g id="front">
  <use href="#reed" transform="translate(372 530)"/><use href="#reed" transform="translate(20 530) scale(.9)"/>
  <use href="#crown" transform="translate(62 250)"/><use href="#crown" transform="translate(350 292) scale(.95)"/>
  <use href="#bush" transform="translate(150 590) scale(.7)"/>
  <use href="#rock" transform="translate(262 598) scale(1.2)"/>
  <use href="#bush" transform="translate(70 640) scale(1.2)"/>
  <use href="#bush" transform="translate(200 668)"/>
  <use href="#bush" transform="translate(330 646) scale(1.3)"/>
  <use href="#frond" transform="translate(-10 700) rotate(-40) scale(1.5)"/>
  <use href="#frond" transform="translate(410 700) scale(-1.4 1.4) rotate(-40)"/>
  <use href="#frond" transform="translate(120 702) rotate(-70) scale(1.1)"/>
</g>

<g id="hits"></g>
<g id="fx"></g>
</svg>

<div id="hud">
  <h1>Find 10 ducks</h1>
  <div class="row">
    <span class="pill" id="cnt">0 / 10</span>
    <span class="pill" id="tm">0:00</span>
    <button class="pill" id="mute" aria-label="Ton an/aus">🔊</button>
  </div>
</div>
<button class="pill" id="hint">💡 Hinweis (+10 s)</button>

<div class="overlay" id="start">
  <h2>Find the Ducks</h2>
  <p>Zehn Enten haben sich versteckt. Finde sie alle, so schnell du kannst!</p>
  <button class="big" id="go">Start</button>
</div>
<div class="overlay hide" id="win">
  <h2>Geschafft!</h2>
  <p id="res"></p>
  <button class="big" id="again">Nochmal</button>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const svg = $('#game'), Ld = $('#ducks'), Lh = $('#hits'), Lf = $('#fx');
  const N = 10;

  // Versteck-Slots: [Typ, x, y]  o = offen, h = hinter Vordergrund, t = getarnt (transparent)
  const SLOTS = [
    ['o',110,452],['o',190,456],['o',280,452],['o',300,452],['o',130,392],['o',250,388],['o',182,342],['o',320,342],
    ['o',72,352],['o',300,508],['o',92,490],['o',200,498],['o',330,400],['o',150,508],['o',232,576],['o',110,578],
    ['o',140,297],['o',290,296],['o',352,496],['o',45,412],
    ['h',70,602],['h',330,606],['h',150,572],['h',262,578],['h',372,512],['h',22,512],
    ['h',88,258],['h',375,310],['h',40,268],
    ['t',110,205],['t',300,215],['t',210,260],['t',350,195],['t',30,285],['t',230,320],['t',60,430]
  ];

  // ---------- Audio (synthetisiert) ----------
  let ac, muted = false;
  const audio = () => {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state !== 'running') ac.resume();
    } catch (e) {}
    return ac;
  };
  ['pointerdown', 'touchend', 'click'].forEach(ev => document.addEventListener(ev, audio, { passive: true }));

  function tone(type, f0, f1, t, dur, vol, filt, q) {
    const o = ac.createOscillator(), g = ac.createGain(), b = ac.createBiquadFilter();
    o.type = type;
    b.type = 'bandpass'; b.frequency.value = filt; b.Q.value = q;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.85);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(b); b.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function quack() {
    if (muted || !audio()) return;
    const t = ac.currentTime, p = 0.9 + Math.random() * 0.25;
    tone('sawtooth', 640 * p, 300 * p, t, 0.11, 0.7, 1100, 3);
    tone('square', 320 * p, 150 * p, t, 0.11, 0.12, 900, 2);
    tone('sawtooth', 570 * p, 260 * p, t + 0.15, 0.09, 0.55, 1000, 3);
  }
  function jingle() {
    if (muted || !audio()) return;
    const t = ac.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, t + i * 0.12, 0.26, 0.35, 2000, 0.7));
    [523, 659, 784, 1047].forEach(f => tone('triangle', f, f, t + 0.55, 0.7, 0.18, 2000, 0.7));
  }

  // ---------- Zustand ----------
  let ducks = [], found = 0, running = false, t0 = 0, endT = 0, pen = 0, hintOn = false;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const ms = () => (running ? performance.now() : endT) - t0 + pen;
  const fmt = v => { const s = Math.floor(v / 1000); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
  const tick = () => { $('#tm').textContent = fmt(ms()); };
  const NS = 'http://www.w3.org/2000/svg';

  function newRound() {
    const all = shuffle(SLOTS.slice()), out = [];
    const add = (f, n, d) => {
      for (const s of all)
        if (n > 0 && out.length < N && f(s) && !out.includes(s) && out.every(o => Math.hypot(o[1] - s[1], o[2] - s[2]) >= d)) { out.push(s); n--; }
    };
    add(s => s[0] === 'h', 3 + (Math.random() < 0.5 ? 1 : 0), 58);
    add(s => s[0] === 't', 2, 58);
    add(s => s[0] === 'o', N, 58);
    add(() => true, N, 58);
    add(() => true, N, 40);
    const soft = out.map((s, i) => i).filter(i => out[i][0] !== 'h');   // Mini-Ente nie hinter Vordergrund
    const tiny = soft[Math.random() * soft.length | 0];
    ducks = out.map(([k, x, y], i) => {
      const s = i === tiny ? 0.5 : k === 'h' ? rnd(0.65, 0.95) : k === 't' ? rnd(0.55, 0.8) : rnd(0.55, 1.05);
      const op = k === 't' ? rnd(0.5, 0.7) : k === 'o' && Math.random() < 0.25 ? 0.75 : 1;
      return { x: x + rnd(-5, 5), y: y + rnd(-5, 5), s, op, flip: Math.random() < 0.5 ? -1 : 1, found: false };
    });
    Ld.innerHTML = Lh.innerHTML = Lf.innerHTML = '';
    ducks.forEach((d, i) => {
      Ld.insertAdjacentHTML('beforeend',
        `<g id="d${i}" transform="translate(${d.x} ${d.y})"><g class="pop"><g class="body" opacity="${d.op}" transform="scale(${d.flip * d.s} ${d.s})">` +
        `<use href="#duck" x="-20" y="-20" width="40" height="40"/></g></g></g>`);
      Lh.insertAdjacentHTML('beforeend',
        `<circle class="hit" data-i="${i}" cx="${d.x}" cy="${d.y}" r="${Math.max(24, 22 * d.s + 8)}"/>`);
    });
    found = 0; pen = 0; hintOn = false; running = true; t0 = performance.now();
    $('#cnt').textContent = `0 / ${N}`;
    $('#start').classList.add('hide'); $('#win').classList.add('hide');
    tick();
  }

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return parent.appendChild(e);
  }

  function findDuck(i) {
    const d = ducks[i];
    if (!running || d.found) return;
    d.found = true; found++;
    quack();
    const g = $('#d' + i);
    g.querySelector('.body').setAttribute('opacity', 1);
    Lf.appendChild(g);                 // Ente kommt vor den Vordergrund
    g.classList.add('found');
    const r = 20 * d.s + 8;
    el('circle', { class: 'mark', r, fill: 'none', stroke: '#3be37a', 'stroke-width': 3.5 }, g);
    const b = el('g', { class: 'mark', transform: `translate(${r * 0.75} ${-r * 0.75})` }, g);
    el('circle', { r: 8, fill: '#3be37a', stroke: '#14301f', 'stroke-width': 1.5 }, b);
    el('path', { d: 'M-4 0L-1 3.5L4.5 -3', fill: 'none', stroke: '#fff', 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, b);
    Lh.querySelector(`[data-i="${i}"]`).remove();
    $('#cnt').textContent = `${found} / ${N}`;
    if (found === N) {
      running = false; endT = performance.now(); tick();
      setTimeout(() => {
        $('#res').textContent = `Alle ${N} Enten gefunden in ${fmt(ms())}`;
        $('#win').classList.remove('hide');
        jingle();
      }, 800);
    }
  }

  function hint() {
    if (!running || hintOn) return;
    const open = ducks.map((d, i) => i).filter(i => !ducks[i].found);
    if (!open.length) return;
    const d = ducks[open[Math.random() * open.length | 0]];
    hintOn = true; pen += 10000; tick();
    $('#tm').classList.add('bad'); setTimeout(() => $('#tm').classList.remove('bad'), 900);
    const c = el('circle', { class: 'hintring', cx: d.x, cy: d.y, r: Math.max(34, 26 * d.s + 10) }, Lf);
    c.addEventListener('animationend', () => { c.remove(); hintOn = false; });
  }

  // ---------- Eingaben ----------
  Lh.addEventListener('pointerdown', e => {
    const c = e.target.closest('.hit');
    if (c) { e.stopPropagation(); e.preventDefault(); findDuck(+c.dataset.i); }
  });
  svg.addEventListener('pointerdown', e => {      // Fehlklick: kleiner neutraler Ring
    if (!running) return;
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    const c = el('circle', { class: 'rip', cx: q.x, cy: q.y, r: 12 }, Lf);
    c.addEventListener('animationend', () => c.remove());
  });
  $('#go').addEventListener('click', () => { audio(); newRound(); });
  $('#again').addEventListener('click', () => { audio(); newRound(); });
  $('#hint').addEventListener('click', hint);
  $('#mute').addEventListener('click', () => {
    muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊';
  });
  setInterval(() => { if (running) tick(); }, 250);
  // Timer pausieren, solange der Tab verborgen ist
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = performance.now();
    else if (hiddenAt) { if (running) t0 += performance.now() - hiddenAt; hiddenAt = 0; tick(); }
  });

  // Zoom / Bounce verhindern
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
</body>
</html>
